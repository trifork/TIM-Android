afterEvaluate {

    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.trifork'
                artifactId = 'TIM-Android'
                version = getLatestGitTag()
                from components.release
            }
        }
    }
}

static String getLatestGitTag() {
    return "git describe --tags --abbrev=0"
            .execute()
            .text
            .replace("\r\n", "")
            .replace("\n", "");
}